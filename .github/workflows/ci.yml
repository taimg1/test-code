name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test Api.Tests
      run: dotnet test VotingSystem.Api.Tests/VotingSystem.Api.Tests.csproj --no-build --verbosity normal --configuration Release

    - name: Test Api.Tests.Integration
      run: dotnet test VotingSystem.Api.Tests.Integration/VotingSystem.Api.Tests.Integration.csproj --no-build --verbosity normal --configuration Release

    - name: Test Api.Tests.Database
      run: dotnet test VotingSystem.Api.Tests.Database/VotingSystem.Api.Tests.Database.csproj --no-build --verbosity normal --configuration Release

  performance-test:
    needs: build-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: VotingSystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup k6
      uses: grafana/setup-k6-action@v1

    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release

    # Фоновий процес без nohup гасне після завершення кроку — k6 отримує connection refused.
    - name: Start API for k6 Tests
      env:
        ASPNETCORE_URLS: http://localhost:5032
        DISABLE_HTTPS_REDIRECT: 'true'
        ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=VotingSystem;Username=postgres;Password=postgres'
      run: |
        nohup dotnet run --project VotingSystem.Api/VotingSystem.Api.csproj --configuration Release --no-build \
          > /tmp/voting-api.log 2>&1 &
        echo $! > /tmp/voting-api.pid
        sleep 2
        tail -n 30 /tmp/voting-api.log || true

    - name: Wait for API to be ready
      run: |
        set -e
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5032/api/elections || echo '000')
          if [ "$code" = "200" ]; then
            echo "API is ready (HTTP $code)"
            exit 0
          fi
          echo "Waiting... ($i/60) HTTP $code"
          tail -n 40 /tmp/voting-api.log 2>/dev/null || true
          sleep 2
        done
        echo "::error::API did not respond with HTTP 200 on /api/elections"
        cat /tmp/voting-api.log || true
        exit 1

    - name: Run k6 Smoke Test
      run: k6 run VotingSystem.PerformanceTests/k6/smoke-test.js --summary-export=k6-smoke.json

    - name: Run k6 Load Test
      run: k6 run VotingSystem.PerformanceTests/k6/load-test.js --summary-export=k6-load.json

    - name: Run k6 Stress Test
      run: k6 run VotingSystem.PerformanceTests/k6/stress-test.js --summary-export=k6-stress.json

    - name: Stop API
      if: always()
      run: |
        if [ -f /tmp/voting-api.pid ]; then
          kill "$(cat /tmp/voting-api.pid)" 2>/dev/null || true
        fi

    - name: Upload k6 results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-results
        path: |
          k6-smoke.json
          k6-load.json
          k6-stress.json
